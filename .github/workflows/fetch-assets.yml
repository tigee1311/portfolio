name: fetch-assets
on:
  push:
    branches: [assets]
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Pull images from the live site and commit them
        run: |
          set -e
          mkdir -p screenshots
          for f in profile.jpg screenshots/adaptive-ai-pt.jpg screenshots/collider-guard.jpg screenshots/frontier-tower-radio.jpg screenshots/medease.jpg screenshots/meme-detector.jpg screenshots/prizepicks-parlay.jpg screenshots/receipt-vault.jpg screenshots/sdohv4.jpg screenshots/warmpath.jpg; do
            curl -fsSL "https://ayush-adi.vercel.app/$f" -o "$f" || curl -fsSL "https://ayush-i3eldurxc-ayush-s-projects-6863003b.vercel.app/$f" -o "$f"
            file "$f" | grep -qi 'JPEG' || { echo "bad $f"; exit 1; }
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile.jpg screenshots
          git commit -m "Add portfolio images"
          git push origin main
